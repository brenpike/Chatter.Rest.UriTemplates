name: Version Check

on:
  workflow_call:
    inputs:
      src-path:
        description: 'Source directory to check for non-markdown changes (e.g., src/MyPackage/)'
        required: true
        type: string
      csproj-path:
        description: 'Path to the .csproj file containing <Version>'
        required: true
        type: string
      tag-prefix:
        description: 'Git tag prefix for this package (e.g., hal, codegen)'
        required: true
        type: string
      extra-src-path:
        description: 'Optional additional source directory to also check for non-markdown changes (e.g., src/CorePackage/)'
        required: false
        default: ''
        type: string

jobs:
  version-check:
    name: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version bump
        shell: bash
        env:
          SRC_PATH: ${{ inputs.src-path }}
          CSPROJ_PATH: ${{ inputs.csproj-path }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          EXTRA_SRC_PATH: ${{ inputs.extra-src-path }}
        run: |
          if [ -n "$EXTRA_SRC_PATH" ]; then
            CHANGED=$(git diff --name-only "origin/main...HEAD" -- "$SRC_PATH" "$EXTRA_SRC_PATH" | grep -v '\.md$' || true)
          else
            CHANGED=$(git diff --name-only "origin/main...HEAD" -- "$SRC_PATH" | grep -v '\.md$' || true)
          fi
          if [ -z "$CHANGED" ]; then
            echo "No non-markdown src/ changes detected. Version bump not required."
            exit 0
          fi
          echo "Changed src/ files requiring version bump check:"
          echo "$CHANGED"

          VERSION=$(grep -m1 '<Version>' "$CSPROJ_PATH" | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d ' \r')

          # SemVer-aware strictly-greater comparison (strips pre-release suffix before comparing)
          version_gt() {
            local v1 v2
            v1=$(echo "$1" | sed 's/-.*//')
            v2=$(echo "$2" | sed 's/-.*//')
            local IFS=.
            local i
            local parts1=($v1) parts2=($v2)
            local len=${#parts2[@]}
            [ ${#parts1[@]} -gt "$len" ] && len=${#parts1[@]}
            for ((i=0; i<len; i++)); do
              local p1=${parts1[i]:-0}
              local p2=${parts2[i]:-0}
              if ((10#$p1 > 10#$p2)); then return 0; fi
              if ((10#$p1 < 10#$p2)); then return 1; fi
            done
            return 1
          }

          # The baseline is the MAXIMUM of two sources: the latest stable
          # release tag AND the <Version> currently on origin/main. Tags are
          # created post-merge by the tag job, so between a version-bump merge
          # and its tag the tag baseline is stale; comparing against
          # origin/main as well closes that window. The PR version must be
          # strictly greater than both.
          LATEST_TAG=$(git tag -l "${TAG_PREFIX}/v*" | grep -v '/v.*-' | sort -V | tail -1 || true)
          MAIN_VERSION=$(git show "origin/main:${CSPROJ_PATH}" 2>/dev/null | grep -m1 '<Version>' | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d ' \r' || true)

          if [ -n "$MAIN_VERSION" ]; then
            if ! version_gt "$VERSION" "$MAIN_VERSION"; then
              echo "ERROR: Version $VERSION must be greater than the origin/main version $MAIN_VERSION. A merged bump may not have been tagged yet; bump above origin/main before merging."
              exit 1
            fi
          else
            echo "No ${CSPROJ_PATH} found on origin/main (new package); skipping origin/main comparison."
          fi

          if [ -z "$LATEST_TAG" ]; then
            if [ -z "$MAIN_VERSION" ]; then
              echo "ERROR: No ${TAG_PREFIX}/v* release tags and no ${CSPROJ_PATH} on origin/main; cannot establish a version baseline."
              exit 1
            fi
            echo "Version check passed (no ${TAG_PREFIX}/v* tags): csproj=$VERSION > origin/main=$MAIN_VERSION"
            exit 0
          fi

          TAG_VERSION="${LATEST_TAG#"${TAG_PREFIX}"/v}"

          if ! version_gt "$VERSION" "$TAG_VERSION"; then
            echo "ERROR: Version $VERSION must be greater than latest release tag version $TAG_VERSION. Bump the version before merging."
            exit 1
          fi

          echo "Version check passed: csproj=$VERSION > latest release tag=$LATEST_TAG and origin/main=${MAIN_VERSION:-<none>}"
