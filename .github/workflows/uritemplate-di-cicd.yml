name: UriTemplates DI CI/CD

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running the workflow'
        required: true
        default: 'Manual build from GitHub UI'

  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'docs/**'
      - 'test/**'
      - 'ci/**'
      - main
    paths:
      - '**/src/Chatter.Rest.UriTemplates/**'
      - '**/src/Chatter.Rest.UriTemplates.DependencyInjection/**'
      - '**/src/Directory.Build.props'
      - '**/test/Chatter.Rest.UriTemplates.DependencyInjection.Tests/**'
      - '.github/workflows/uritemplate-di-cicd.yml'
      - '.github/workflows/version-check.yml'
      - '.github/workflows/create-version-tag.yml'

  pull_request:
    branches:
      - main
    paths:
      - '**/src/Chatter.Rest.UriTemplates/**'
      - '**/src/Chatter.Rest.UriTemplates.DependencyInjection/**'
      - '**/src/Directory.Build.props'
      - '**/test/Chatter.Rest.UriTemplates.DependencyInjection.Tests/**'
      - '.github/workflows/uritemplate-di-cicd.yml'
      - '.github/workflows/version-check.yml'
      - '.github/workflows/create-version-tag.yml'

env:
  dotnet-version: '8.0.x'

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.dotnet-version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (DI)
        run: dotnet test test/Chatter.Rest.UriTemplates.DependencyInjection.Tests/Chatter.Rest.UriTemplates.DependencyInjection.Tests.csproj -c Release --no-build

      - name: Pack (DI)
        run: dotnet pack src/Chatter.Rest.UriTemplates.DependencyInjection/Chatter.Rest.UriTemplates.DependencyInjection.csproj -c Release --no-build -o publish/nuget

      - name: Upload NuGet
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nuget-uritemplate-di
          path: publish/nuget/**
          retention-days: 5
          if-no-files-found: error

  version-check:
    name: version-check
    uses: ./.github/workflows/version-check.yml
    if: github.event_name == 'pull_request'
    with:
      src-path: 'src/Chatter.Rest.UriTemplates.DependencyInjection/'
      csproj-path: 'src/Chatter.Rest.UriTemplates.DependencyInjection/Chatter.Rest.UriTemplates.DependencyInjection.csproj'
      tag-prefix: 'uritemplate-di'
      # Keep this source set identical to the deploy job's SRC_PATTERN so the
      # pre-merge version check and the post-merge publish gate agree.
      extra-src-path: 'src/Directory.Build.props'

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # only the push produced by merging to protected main; never workflow_dispatch

    # Serialize the publish gate and NuGet push per package: two overlapping
    # main pushes must not both observe a version as unpublished and race the
    # upload. Job-level (not workflow-level) so unrelated branch/PR builds keep
    # running in parallel; cancel-in-progress stays false because cancelling a
    # run mid-`dotnet nuget push` is worse than letting it queue.
    concurrency:
      group: nuget-deploy-uritemplate-di-${{ github.ref }}
      cancel-in-progress: false

    environment:
      name: Production

    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY_CHATTER_URITEMPLATE }}
      NUGET_URL: https://api.nuget.org/v3/index.json

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download NuGet
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nuget-uritemplate-di
          path: ./dist/nuget

      - name: Determine publish action
        id: publish-gate
        shell: bash
        env:
          PACKAGE_ID: 'Chatter.Rest.UriTemplates.DependencyInjection'
          CSPROJ_PATH: 'src/Chatter.Rest.UriTemplates.DependencyInjection/Chatter.Rest.UriTemplates.DependencyInjection.csproj'
          SRC_PATTERN: '^src/Chatter\.Rest\.UriTemplates\.DependencyInjection/|^src/Directory\.Build\.props$'
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          VERSION=$(grep -m1 '<Version>' "$CSPROJ_PATH" | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d ' \r')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read <Version> from $CSPROJ_PATH"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PACKAGE_ID_LOWER=$(printf '%s' "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]')
          INDEX_URL="https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID_LOWER}/index.json"
          INDEX_FILE=$(mktemp)
          HTTP_STATUS=$(curl -sS -o "$INDEX_FILE" -w '%{http_code}' "$INDEX_URL")

          PUBLISHED=false
          if [ "$HTTP_STATUS" = "404" ]; then
            echo "$PACKAGE_ID has never been published to nuget.org; treating $VERSION as unpublished."
          elif [ "$HTTP_STATUS" = "200" ]; then
            if jq -e --arg v "$VERSION" '.versions | index($v) != null' "$INDEX_FILE" > /dev/null; then
              PUBLISHED=true
            fi
          else
            echo "::error::Unexpected HTTP status $HTTP_STATUS querying $INDEX_URL"
            exit 1
          fi

          if [ "$PUBLISHED" = "false" ]; then
            echo "$PACKAGE_ID $VERSION is not on nuget.org; it will be pushed."
            echo "push=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Version already on nuget.org: only acceptable when this push did not
          # change the package's own (non-markdown) sources.
          BASE_SHA="$BEFORE_SHA"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="${CURRENT_SHA}^"
          fi

          CHANGED_SOURCES=$(git diff --name-only "$BASE_SHA" "$CURRENT_SHA" | grep -E "$SRC_PATTERN" | grep -v '\.md$' || true)

          if [ -n "$CHANGED_SOURCES" ]; then
            echo "::error::$PACKAGE_ID $VERSION is already published on nuget.org, but this push changed package sources without a version bump. Bump <Version> in $CSPROJ_PATH."
            echo "Changed source files:"
            echo "$CHANGED_SOURCES"
            exit 1
          fi

          echo "::notice::$PACKAGE_ID $VERSION is already published and this push did not change package sources; skipping NuGet push."
          echo "push=false" >> "$GITHUB_OUTPUT"

      - name: Push NuGet packages
        if: steps.publish-gate.outputs.push == 'true'
        shell: bash
        env:
          PACKAGE_ID: 'Chatter.Rest.UriTemplates.DependencyInjection'
          VERSION: ${{ steps.publish-gate.outputs.version }}
        run: |
          set -euo pipefail

          PUSH_LOG=$(mktemp)
          if dotnet nuget push "./dist/nuget/*.nupkg" \
            -k "$NUGET_AUTH_TOKEN" \
            -s "$NUGET_URL" 2>&1 | tee "$PUSH_LOG"; then
            exit 0
          fi

          # The publish gate saw this version as unpublished, so a 409 Conflict
          # here means another publisher pushed the same version between the
          # gate's index query and this push. Classify it distinctly, but only
          # after re-checking the index so no other failure is masked.
          if grep -qiE '(: 409|conflict)' "$PUSH_LOG"; then
            PACKAGE_ID_LOWER=$(printf '%s' "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]')
            INDEX_URL="https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID_LOWER}/index.json"
            if curl -sS "$INDEX_URL" | jq -e --arg v "$VERSION" '.versions | index($v) != null' > /dev/null; then
              echo "::warning::$PACKAGE_ID $VERSION was published concurrently by another publisher; treating this run's 409 as 'version already published', not a deploy failure."
              exit 0
            fi
            echo "::error::NuGet push returned 409 Conflict but $PACKAGE_ID $VERSION is not visible in the nuget.org index (possibly index propagation delay). Failing so this can be investigated."
            exit 1
          fi

          echo "::error::dotnet nuget push failed; see log above."
          exit 1

  tag:
    name: tag
    uses: ./.github/workflows/create-version-tag.yml
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    with:
      csproj-path: 'src/Chatter.Rest.UriTemplates.DependencyInjection/Chatter.Rest.UriTemplates.DependencyInjection.csproj'
      tag-prefix: 'uritemplate-di'
      package-name: 'Chatter.Rest.UriTemplates.DependencyInjection'
