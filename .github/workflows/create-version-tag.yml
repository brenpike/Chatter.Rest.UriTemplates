name: Create Version Tag

on:
  workflow_call:
    inputs:
      csproj-path:
        description: 'Path to the .csproj file containing <Version>'
        required: true
        type: string
      tag-prefix:
        description: 'Git tag prefix for this package (e.g., hal, codegen)'
        required: true
        type: string
      package-name:
        description: 'Human-readable package name for tag annotation (e.g., Chatter.Rest.Hal)'
        required: true
        type: string

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create version tag
        shell: bash
        env:
          CSPROJ_PATH: ${{ inputs.csproj-path }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          PACKAGE_NAME: ${{ inputs.package-name }}
        run: |
          VERSION=$(grep -m1 '<Version>' "$CSPROJ_PATH" | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d ' \r')
          TAG="${TAG_PREFIX}/v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "${PACKAGE_NAME} v${VERSION}"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi
