# Keeps SHA-pinned GitHub Actions current across all workflows.
# A `nuget` ecosystem entry is a deliberate follow-up: the dependency-pinning
# lane (#27) is regenerating the test lockfiles, and adding NuGet updates now
# would produce competing lockfile changes.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One weekly PR for all action bumps. This also keeps the CodeQL
    # init/autobuild/analyze steps on the same version: CodeQL fails when they
    # differ, so separate PRs for them can never pass on their own.
    groups:
      github-actions:
        patterns:
          - "*"
